<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Danh Tran — Unity Game Developer</title>
  <desc id="desc">A purple and blue galaxy banner with stars, orbit lines, and glowing text.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.46" stop-color="#160B33"/>
      <stop offset="1" stop-color="#06152B"/>
    </linearGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#6D28D9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.54"/>
      <stop offset="0.55" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9D5FF"/>
      <stop offset="0.48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="340" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="340" fill="url(#space)"/>
    <ellipse cx="310" cy="110" rx="390" ry="240" fill="url(#nebulaPurple)" transform="rotate(-15 310 110)"/>
    <ellipse cx="930" cy="260" rx="420" ry="220" fill="url(#nebulaBlue)" transform="rotate(12 930 260)"/>

    <g fill="none" stroke-linecap="round">
      <ellipse cx="600" cy="170" rx="500" ry="115" stroke="#A78BFA" stroke-opacity="0.24" stroke-width="1.5" transform="rotate(-8 600 170)"/>
      <ellipse cx="600" cy="170" rx="430" ry="78" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1" transform="rotate(10 600 170)"/>
      <path d="M-40 278 C230 135 385 355 665 210 C880 99 1003 167 1240 32" stroke="#C084FC" stroke-opacity="0.14" stroke-width="2"/>
    </g>

    <g fill="#FFFFFF">
      <circle cx="56" cy="62" r="1.4" opacity="0.75"/>
      <circle cx="106" cy="206" r="1.1" opacity="0.62"/>
      <circle cx="154" cy="105" r="2.1" opacity="0.94" filter="url(#starGlow)"/>
      <circle cx="205" cy="287" r="1.2" opacity="0.72"/>
      <circle cx="262" cy="48" r="1.1" opacity="0.58"/>
      <circle cx="312" cy="223" r="1.7" opacity="0.82"/>
      <circle cx="375" cy="77" r="1.2" opacity="0.7"/>
      <circle cx="425" cy="302" r="2" opacity="0.92" filter="url(#starGlow)"/>
      <circle cx="482" cy="32" r="1.3" opacity="0.76"/>
      <circle cx="534" cy="262" r="1" opacity="0.58"/>
      <circle cx="588" cy="74" r="1.5" opacity="0.84"/>
      <circle cx="642" cy="295" r="1.4" opacity="0.68"/>
      <circle cx="701" cy="45" r="2" opacity="0.94" filter="url(#starGlow)"/>
      <circle cx="756" cy="235" r="1.1" opacity="0.64"/>
      <circle cx="819" cy="89" r="1.6" opacity="0.8"/>
      <circle cx="872" cy="300" r="1.2" opacity="0.72"/>
      <circle cx="930" cy="42" r="1.1" opacity="0.62"/>
      <circle cx="984" cy="218" r="2" opacity="0.9" filter="url(#starGlow)"/>
      <circle cx="1039" cy="103" r="1.2" opacity="0.74"/>
      <circle cx="1104" cy="275" r="1.6" opacity="0.84"/>
      <circle cx="1153" cy="57" r="1.2" opacity="0.68"/>
      <circle cx="78" cy="312" r="0.9" opacity="0.5"/>
      <circle cx="232" cy="155" r="0.9" opacity="0.52"/>
      <circle cx="348" cy="178" r="0.8" opacity="0.5"/>
      <circle cx="463" cy="128" r="0.9" opacity="0.48"/>
      <circle cx="731" cy="134" r="0.8" opacity="0.48"/>
      <circle cx="846" cy="178" r="0.9" opacity="0.52"/>
      <circle cx="1091" cy="158" r="0.8" opacity="0.5"/>
    </g>

    <g transform="translate(1020 74)">
      <circle r="38" fill="#8B5CF6" opacity="0.16" filter="url(#softGlow)"/>
      <circle r="17" fill="#E9D5FF"/>
      <circle cx="-7" cy="-6" r="17" fill="#A78BFA" opacity="0.42"/>
      <ellipse rx="55" ry="13" fill="none" stroke="#67E8F9" stroke-opacity="0.46" stroke-width="2" transform="rotate(-16)"/>
    </g>

    <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
      <text x="600" y="153" fill="url(#titleGradient)" font-size="72" font-weight="750" letter-spacing="4" filter="url(#softGlow)">DANH TRAN</text>
      <text x="600" y="205" fill="#E2E8F0" font-size="25" font-weight="600" letter-spacing="8">UNITY GAME DEVELOPER</text>
      <text x="600" y="247" fill="#94A3B8" font-size="16" letter-spacing="3">GAMEPLAY  •  MULTIPLAYER  •  GAME SYSTEMS</text>
    </g>

    <g transform="translate(600 290)" fill="#67E8F9" filter="url(#starGlow)">
      <circle cx="-36" r="2"/>
      <circle r="3"/>
      <circle cx="36" r="2"/>
    </g>
  </g>
</svg>
